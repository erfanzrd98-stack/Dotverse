<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Dotverse</title>
<style>
  :root{ --bg:#fff; --ink:#14181f; --muted:#6b7280; --line:#e7e9ee; --dot:#3d5afe; --dot-soft:#eef0ff; --danger:#e14b4b; }
  *{box-sizing:border-box;} html,body{height:100%;margin:0;font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;}
  .hidden{display:none!important;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
  
  /* Auth */
  .auth-wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;overflow-y:auto;}
  .auth-card{width:100%;max-width:380px;border:1px solid var(--line);border-radius:14px;padding:32px 28px;background:#fff;box-shadow:0 12px 32px -12px rgba(0,0,0,.1);}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand-dot{width:14px;height:14px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px var(--dot-soft);}
  .brand-name{font-size:20px;font-weight:700;}
  .auth-sub{color:var(--muted);font-size:13.5px;margin:0 0 24px;}
  .tabs{display:flex;gap:4px;margin-bottom:20px;background:#f4f5f7;border-radius:10px;padding:3px;}
  .tab{flex:1;text-align:center;padding:8px 0;font-size:13.5px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--muted);}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);}
  label.field{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 6px;}
  input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;outline:none;background:#fbfbfc;}
  input:focus{border-color:var(--dot);background:#fff;}
  .btn{padding:12px 0;border:none;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:700;width:100%;background:var(--dot);color:#fff;margin-top:20px;}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;background:#f4f5f7;color:var(--ink);width:auto;margin:0;}
  .btn-danger{background:#ef4444;color:#fff;}
  .auth-msg{font-size:13px;margin-top:12px;min-height:16px;color:var(--danger);}

  /* Shell & Scrolling Fix */
  #app{height:100%; display:flex; flex-direction:column;}
  #shell{display:flex;flex-direction:column;height:100%;overflow:hidden;}
  #topbar-mobile{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff;flex-shrink:0;overflow-x:auto;}
  .topbar-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;cursor:pointer;color:var(--muted);min-width:52px;}
  .topbar-btn .tb-icon{font-size:18px;}
  .topbar-btn .tb-label{font-size:8.5px;font-weight:700;}
  .topbar-btn.hidden{display:none;}
  
  #main{flex:1;display:flex;flex-direction:column;min-height:0;}
  #room-header{display:flex;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-shrink:0;}
  #room-header .rtitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  #room-header .rscore{font-size:12px;color:var(--muted);}
  
  #messages{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;}
  .msg{display:flex;gap:8px;align-items:flex-start;}
  .avatar-emoji{font-size:16px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--dot-soft);border-radius:50%;flex-shrink:0;cursor:pointer;}
  .msg-body{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .msg-name{font-size:13px;font-weight:700;cursor:pointer;}
  .msg-text{font-size:14px;word-break:break-word;}
  .sys-msg{text-align:center;color:var(--muted);font-size:12px;font-style:italic;margin:5px 0;}
  
  #composer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);flex-shrink:0;}
  #composer input{flex:1;}
  #composer button{padding:0 20px;margin:0;width:auto;}

  /* Modals & Menus */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;overflow-y:auto;}
  .modal-card{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:380px;max-height:86vh;overflow-y:auto;box-sizing:border-box;}
  .modal-card.wide{max-width:600px;}
  .close-x{float:right;cursor:pointer;color:var(--muted);font-weight:700;}
  .list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f4f5f7;font-size:13px;cursor:pointer;}
  .ctx-menu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.2);padding:6px;z-index:90;min-width:180px;}
  .ctx-item{padding:9px 12px;font-size:13px;font-weight:600;border-radius:7px;cursor:pointer;}
  .ctx-item:hover{background:#f4f5f7;}
  
  /* Center PM Popups Stack (Compact & Fit-content) */
  #pm-popup-root{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:120;display:flex;flex-direction:column;gap:10px;width:auto;max-width:90vw;align-items:center;}
  .pm-popup-card{width:fit-content;min-width:200px;max-width:280px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.3);display:flex;flex-direction:column;overflow:hidden;}
  .pm-popup-header{padding:8px 12px;font-weight:bold;font-size:13px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,0.2);}
  .pm-popup-close{cursor:pointer;font-size:16px;opacity:0.8;}
  .pm-popup-text{padding:12px;font-size:13.5px;word-break:break-word;white-space:pre-wrap;flex:1;text-align:center;}
  .pm-popup-actions{padding:8px;display:flex;gap:6px;}
  .pm-popup-actions button{flex:1;padding:7px 10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:12px;background:rgba(255,255,255,0.9);}
  .pm-popup-reply-box{padding:8px;display:flex;gap:6px;}
  .pm-popup-reply-box input{flex:1;padding:7px 10px;border-radius:6px;border:1px solid rgba(0,0,0,0.2);background:#fff;color:#000;font-size:12.5px;}
  .pm-popup-reply-box button{padding:7px 12px;border:none;border-radius:6px;font-size:12px;font-weight:600;background:#fff;color:#000;cursor:pointer;}
  
  /* PM History View */
  .pm-history-view{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;padding:10px;background:#f9f9f9;border-radius:8px;margin-bottom:16px;}
  .pm-history-msg{max-width:80%;padding:8px 12px;border-radius:8px;font-size:13px;word-break:break-word;}
  .pm-history-msg b{font-size:10px;display:block;margin-bottom:2px;opacity:0.8;}
</style>
</head>
<body>

<div id="auth-screen" class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
    <p class="auth-sub">A tiny chat world. Ten seats. One dot at a time.</p>
    <div class="tabs">
      <div class="tab active" id="tab-login">Log in</div>
      <div class="tab" id="tab-register">Register</div>
    </div>
    <div id="form-login">
      <label class="field">Username</label><input type="text" id="login-username" />
      <label class="field">Password</label><input type="password" id="login-password" />
      <button class="btn" id="btn-login">Log in</button>
    </div>
    <div id="form-register" class="hidden">
      <label class="field">Username</label><input type="text" id="reg-username" />
      <label class="field">Password</label><input type="password" id="reg-password" />
      <label class="field">Gender</label><select id="reg-gender"><option value="male">Male</option><option value="female">Female</option></select>
      <label class="field">City</label><input type="text" id="reg-city" />
      <button class="btn" id="btn-register">Create account</button>
    </div>
    <div class="auth-msg" id="auth-msg"></div>
  </div>
</div>

<div id="shell" class="hidden">
  <div id="topbar-mobile">
    <div class="topbar-btn" id="tb-profile"><span class="tb-icon" id="tb-profile-avatar">🙂</span><span class="tb-label">Profile</span></div>
    <div class="topbar-btn" id="tb-pms"><span class="tb-icon">✉️</span><span class="tb-label">PMs</span></div>
    <div class="topbar-btn" id="tb-rooms"><span class="tb-icon">💬</span><span class="tb-label">Rooms</span></div>
    <div class="topbar-btn" id="tb-dots"><span class="tb-icon">🪙</span><span class="tb-label" id="tb-dots-count">0</span></div>
    <div class="topbar-btn" id="tb-games"><span class="tb-icon">🎮</span><span class="tb-label">Games</span></div>
    <div class="topbar-btn hidden" id="tb-admin"><span class="tb-icon">👑</span><span class="tb-label">Admin</span></div>
    <div class="topbar-btn" id="tb-roominfo"><span class="tb-icon">ℹ️</span><span class="tb-label">Room</span></div>
  </div>
  <div id="main">
    <div id="room-header">
      <div class="rtitle"><span id="room-title">Lobby</span><span class="rscore" id="room-meta">ID: 1</span></div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input type="text" id="msg-input" placeholder="Say something…" maxlength="500" />
      <button class="btn btn-sm" id="btn-send">Send</button>
    </div>
  </div>
</div>

<div id="modal-root"></div>
<div id="context-root"></div>
<div id="pm-popup-root"></div>

<script>
const API = "https://dotverse-api.erfanzrd98.workers.dev";
let currentUser = null, currentRoom = "1", msgInterval = null, inboxInterval = null, lastInboxId = 0;
const AVATARS = ["🙂","😎","🐱","🐼","🦊","🐸","👽","🤖","🌟","🔥","🍀","🌙","👑"];
const COLORS = ["#000000","#2563eb","#dc2626","#16a34a","#9333ea","#ea580c","#0891b2","#db2777","#f5780e"];

function el(id){return document.getElementById(id);}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}
function showMsg(t,ok){const e=el('auth-msg');e.textContent=t;e.className='auth-msg '+(ok?'ok':'error');}

function getPmColor(user) {
    if (!user) return '#f0f0f0';
    if (user.isDotMaster === 1) return '#f5780e'; // Hex code for DotMaster
    let score = user.score || 0;
    let gender = user.gender || 'male';
    if (score <= 100) return gender === 'female' ? '#f9a8d4' : '#93c5fd';
    if (score <= 200) return gender === 'female' ? '#dc2626' : '#1d4ed8';
    if (score <= 1000) return '#c4b5fd';
    if (score <= 1500) return '#7c3aed';
    if (score <= 2000) return '#4b5563';
    return '#eab308';
}

function getTextColor(bgColor) {
    const darkColors = ['#1d4ed8', '#dc2626', '#7c3aed', '#4b5563', '#f5780e'];
    return darkColors.includes(bgColor) ? '#ffffff' : '#000000';
}

el('tab-login').onclick=()=>{el('tab-login').classList.add('active');el('tab-register').classList.remove('active');el('form-login').classList.remove('hidden');el('form-register').classList.add('hidden');showMsg('',true);};
el('tab-register').onclick=()=>{el('tab-register').classList.add('active');el('tab-login').classList.remove('active');el('form-register').classList.remove('hidden');el('form-login').classList.add('hidden');showMsg('',true);};

el('btn-register').onclick = async () => {
  const u=el('reg-username').value.trim(),p=el('reg-password').value,g=el('reg-gender').value,c=el('reg-city').value.trim();
  if(!u||!p) return showMsg('Username and password required.');
  try{
    const r=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,gender:g,city:c})});
    const d=await r.json();
    if(d.success){currentUser=d.user;startApp();}else{showMsg(d.message);}
  }catch(e){showMsg('Network error');}
};

el('btn-login').onclick = async () => {
  const u=el('login-username').value.trim(),p=el('login-password').value;
  if(!u||!p) return showMsg('Enter credentials.');
  try{
    const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(d.success){currentUser=d.user;startApp();}else{showMsg(d.message);}
  }catch(e){showMsg('Network error');}
};

async function startApp(){
  el('auth-screen').classList.add('hidden');
  el('shell').classList.remove('hidden');
  if(currentUser.isDotMaster===1) el('tb-admin').classList.remove('hidden');
  updateTopBar();
  loadRooms();
  joinRoom('1');
  setInterval(loadRooms, 10000);
  
  try {
    const rInit = await fetch(`${API}/api/get-last-pm-id?username=${currentUser.username}`);
    const dInit = await rInit.json();
    if(dInit.success) lastInboxId = dInit.lastId || 0;
  } catch(e) {}
  
  startInboxPolling();
}

function updateTopBar(){
  el('tb-profile-avatar').textContent = currentUser.avatar||'🙂';
  el('tb-dots-count').textContent = currentUser.isDotMaster?'∞':currentUser.dots;
}

// Popups for New Messages
function startInboxPolling(){
  if(inboxInterval) clearInterval(inboxInterval);
  checkInbox();
  inboxInterval = setInterval(checkInbox, 1000); 
}

async function checkInbox(){
  if(!currentUser) return;
  try{
    const r=await fetch(`${API}/api/get-inbox?username=${currentUser.username}&last_id=${lastInboxId}`);
    const d=await r.json();
    if(d.success && d.messages.length > 0){
      d.messages.forEach(m => {
        lastInboxId = m.id;
        if(m.sender !== currentUser.username){
          fetch(API+'/api/user?username='+m.sender).then(res=>res.json()).then(data=>{
            if(data.success) openPMPopup(m.sender, m.text, data.user);
          });
        }
      });
    }
  }catch(e){}
}

function openPMPopup(sender, text, senderData) {
  const color = getPmColor(senderData);
  const txtColor = getTextColor(color);
  const popupId = 'pm-' + Date.now() + Math.random().toString(36).substr(2,5);
  
  const popup = document.createElement('div');
  popup.className = 'pm-popup-card';
  popup.id = popupId;
  popup.style.backgroundColor = color;
  popup.style.color = txtColor;
  
  let html = `
    <div class="pm-popup-header">
      <span>${escapeHtml(sender)}</span>
      <span class="pm-popup-close" onclick="document.getElementById('${popupId}').remove()">×</span>
    </div>
    <div class="pm-popup-text">${escapeHtml(text)}</div>
    <div class="pm-popup-actions" id="actions-${popupId}">
      <button style="color:#000;" onclick="viewProfile('${sender}'); document.getElementById('${popupId}').remove();">About user</button>
      <button style="color:#000; background:rgba(255,255,255,0.9);" onclick="showReplyBox('${popupId}', '${sender}')">Reply</button>
    </div>
    <div class="pm-popup-reply-box hidden" id="reply-${popupId}">
      <input type="text" id="input-${popupId}" placeholder="Type reply..." style="color:#000;" />
      <button style="background:#fff;color:#000;" onclick="sendReply('${sender}', '${popupId}')">Send</button>
    </div>
  `;
           
  popup.innerHTML = html;
  el('pm-popup-root').appendChild(popup);
}

function showReplyBox(popupId, sender) {
  document.getElementById(`actions-${popupId}`).classList.add('hidden');
  const replyBox = document.getElementById(`reply-${popupId}`);
  replyBox.classList.remove('hidden');
  const inp = document.getElementById(`input-${popupId}`);
  inp.focus();
  inp.addEventListener('keydown', e => { if(e.key==='Enter') sendReply(sender, popupId); });
}

async function sendReply(sender, popupId) {
  const inp = document.getElementById(`input-${popupId}`);
  const t = inp.value.trim();
  if(!t) return;
  await fetch(API+'/api/send-pm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:currentUser.username,receiver:sender,text:t})});
  document.getElementById(popupId).remove(); 
}

// Modals
function openModal(t,b,wide){el('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal-card ${wide?'wide':''}"><span class="close-x" onclick="closeModal()">✕</span><h3 style="margin:0 0 16px;font-size:16px;">${t}</h3>${b}</div></div>`;}
function closeModal(){el('modal-root').innerHTML='';}

function showCtx(e,u){
  e.stopPropagation();
  const m=document.createElement('div');
  m.className='ctx-menu';
  m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';
  m.innerHTML=`
    <div class="ctx-item" onclick="startNewPM('${u}');closeCtx();">💬 Private Message</div>
    <div class="ctx-item" onclick="viewProfile('${u}');closeCtx();">👤 View Profile</div>
    <div class="ctx-item" onclick="addFriend('${u}');closeCtx();">➕ Add Friend</div>
    <div class="ctx-item" onclick="sendDotsPrompt('${u}');closeCtx();">🪙 Send Dots</div>
    ${currentUser.isDotMaster===1?`<div class="ctx-item" onclick="banUser('${u}');closeCtx();">🔨 Ban User</div>`:''}
  `;
  el('context-root').innerHTML='';el('context-root').appendChild(m);
}
function closeCtx(){el('context-root').innerHTML='';}
window.onclick=closeCtx;

async function loadRooms(){
  try{
    const r=await fetch(API+'/api/rooms');const d=await r.json();
    if(d.success){const room=d.rooms.find(x=>x.id==currentRoom);if(room){el('room-title').textContent=room.name;el('room-meta').textContent='ID: '+room.id+' · '+room.score+' pts';}}
  }catch(e){}
}
async function joinRoom(id){
  currentRoom=id;
  if(msgInterval) clearInterval(msgInterval);
  loadMessages();
  msgInterval=setInterval(loadMessages,2000);
  closeModal();
}
async function loadMessages(){
  try{
    const r=await fetch(API+'/api/messages?room_id='+currentRoom);const d=await r.json();
    if(d.success){
      const w=el('messages');w.innerHTML='';
      d.messages.forEach(m=>{
        const div=document.createElement('div');
        if(m.username==='system'){div.className='sys-msg';div.textContent=m.text;}
        else{
          div.className='msg';
          div.innerHTML=`<span class="avatar-emoji" onclick="showCtx(event,'${m.username}')">${m.avatar||'🙂'}</span>
          <div class="msg-body"><span class="msg-name" style="color:${m.nameColor||'#000'}" onclick="showCtx(event,'${m.username}')">${escapeHtml(m.username)}</span><span class="msg-text">${escapeHtml(m.text)}</span></div>`;
        }
        w.appendChild(div);
      });
      w.scrollTop=w.scrollHeight;
    }
  }catch(e){}
}
el('btn-send').onclick=async()=>{
  const t=el('msg-input').value.trim();if(!t)return;el('msg-input').value='';
  try{
    const r=await fetch(API+'/api/send-message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({room_id:currentRoom,username:currentUser.username,avatar:currentUser.avatar,text:t,nameColor:currentUser.nameColor})});
    const d=await r.json();
    if(!d.success) alert(d.message);
    loadMessages();
  }catch(e){}
};
el('msg-input').addEventListener('keydown',e=>{if(e.key==='Enter')el('btn-send').click();});

el('tb-rooms').onclick=async()=>{
  const r=await fetch(API+'/api/rooms');const d=await r.json();
  let rows='';
  d.rooms.forEach(r=>{const icon=r.id===1?'💬':r.id===2?'⭐':'🏠';rows+=`<div class="list-row" onclick="joinRoom('${r.id}')"><span>${icon}</span><span style="flex:1;font-weight:600;">${escapeHtml(r.name)}</span><span style="color:var(--muted)">${r.score} pts</span></div>`;});
  rows+=`<button class="btn" style="margin-top:16px;" onclick="createRoomPrompt()">➕ Create Room (5 dots)</button>`;
  openModal('Chat Rooms',rows);
};
async function createRoomPrompt(){
  const name=prompt('Room name:');if(!name)return;
  const r=await fetch(API+'/api/create-room',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,creator:currentUser.username})});
  const d=await r.json();
  if(d.success){alert('Room created!');closeModal();loadRooms();}else{alert(d.message);}
}

el('tb-profile').onclick=()=>{
  let avHtml=AVATARS.map(a=>`<span class="avatar-emoji" style="width:36px;height:36px;font-size:18px;cursor:pointer;border:2px solid transparent;" onclick="selAvatar('${a}',this)">${a}</span>`).join('');
  let coHtml=COLORS.map(c=>`<span style="width:28px;height:28px;border-radius:50%;background:${c};cursor:pointer;display:inline-block;margin:2px;border:2px solid transparent;" onclick="selColor('${c}',this)"></span>`).join('');
  openModal('Profile',`
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;" id="av-grid">${avHtml}</div>
    <div class="list-row"><span>User ID</span><b style="color:var(--muted)">#${currentUser.id}</b></div>
    <label class="field">Username</label><input type="text" id="p-username" value="${escapeHtml(currentUser.username)}" />
    <label class="field">New Password (leave blank to keep)</label><input type="password" id="p-password" placeholder="••••••" />
    <label class="field">City</label><input type="text" id="p-city" value="${escapeHtml(currentUser.city||'')}" />
    <label class="field">Name Color (2 dots)</label><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px;" id="col-grid">${coHtml}</div>
    <div style="display:flex;justify-content:space-between;font-size:13px;margin:10px 0;"><span>Dots: <b>${currentUser.isDotMaster?'∞':currentUser.dots}</b></span><span>Score: <b>${currentUser.score}</b></span></div>
    <button class="btn" onclick="saveProfile()">Save Changes</button>
    <button class="btn btn-danger" style="margin-top:8px;background:#ef4444;" onclick="location.reload()">Logout</button>
  `);
  window._av=currentUser.avatar;window._co=currentUser.nameColor;
};
window.selAvatar=(a,e)=>{window._av=a;e.parentElement.querySelectorAll('.avatar-emoji').forEach(x=>x.style.border='2px solid transparent');e.style.border='2px solid var(--dot)';};
window.selColor=(c,e)=>{window._co=c;e.parentElement.querySelectorAll('span').forEach(x=>x.style.border='2px solid transparent');e.style.border='2px solid #000';};
window.saveProfile=async()=>{
  const r=await fetch(API+'/api/update-profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    username:currentUser.username,
    newUsername:el('p-username').value.trim(),
    newPassword:el('p-password').value,
    avatar:window._av,
    gender:currentUser.gender,
    city:el('p-city').value,
    nameColor:window._co
  })});
  const d=await r.json();
  if(d.success){currentUser=d.user;updateTopBar();alert('Saved!');closeModal();}else{alert(d.message);}
};

el('tb-dots').onclick=()=>{
  openModal('Transfer Dots',`
    <label class="field">Recipient Username</label><input type="text" id="td-to" />
    <label class="field">Amount</label><input type="number" id="td-amt" />
    <button class="btn" onclick="transferDots()">Send</button>
  `);
};
window.transferDots=async()=>{
  const to=el('td-to').value.trim(),amt=parseInt(el('td-amt').value);
  if(!to||!amt)return alert('Invalid input');
  const r=await fetch(API+'/api/transfer-dots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:currentUser.username,to,amount:amt})});
  const d=await r.json();
  if(d.success){alert('Sent!');closeModal();}else{alert(d.message);}
};
window.sendDotsPrompt=(u)=>{
  const amt=prompt(`Send dots to ${u}:`);
  if(amt) transferDotsPrompt(u,parseInt(amt));
};
async function transferDotsPrompt(to,amt){
  const r=await fetch(API+'/api/transfer-dots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:currentUser.username,to,amount:amt})});
  const d=await r.json();
  if(d.success)alert('Sent!');else alert(d.message);
}

// PMs History Modal
el('tb-pms').onclick=async()=>{
  let friends=JSON.parse(currentUser.friends||'[]');
  let rows='<p style="color:var(--muted);text-align:center;font-size:13px;margin-bottom:16px;">Select a user to view chat history.</p>';
  if(friends.length===0) rows='<p style="color:var(--muted);text-align:center;">No friends yet. Tap a user in chat to add them.</p>';
  friends.forEach(f=>{rows+=`<div class="list-row" onclick="showPMHistory('${f}')"><span style="flex:1;font-weight:600;">${escapeHtml(f)}</span><span>💬</span></div>`;});
  rows+=`<button class="btn" style="margin-top:16px;" onclick="startNewPM()">Start New PM</button>`;
  openModal('Private Messages',rows);
};

window.showPMHistory=async(u)=>{
  const rMsgs=await fetch(`${API}/api/pms?u1=${currentUser.username}&u2=${u}`);
  const dMsgs=await rMsgs.json();
  const rUser=await fetch(`${API}/api/user?username=${u}`);
  const otherUser=(await rUser.json()).user;

  let historyHtml='<div class="pm-history-view" id="pm-history-container">';
  if(dMsgs.success && dMsgs.messages.length>0){
    dMsgs.messages.forEach(m=>{
      const isMine=m.sender===currentUser.username;
      const senderData=isMine?currentUser:otherUser;
      const color=getPmColor(senderData);
      const txtColor=getTextColor(color);
      historyHtml+=`<div class="pm-history-msg" style="align-self:${isMine?'flex-end':'flex-start'};background:${color};color:${txtColor};">
                      <b>${escapeHtml(m.sender)}</b>${escapeHtml(m.text)}
                    </div>`;
    });
  } else {
    historyHtml+='<p style="text-align:center;color:var(--muted);">No history yet. Say hi!</p>';
  }
  historyHtml+='</div>';
  
  historyHtml+=`
    <div style="display:flex;gap:8px;">
      <input type="text" id="pm-history-input" placeholder="Type a message..." style="flex:1;" />
      <button class="btn-sm" onclick="sendPMFromHistory('${u}')">Send</button>
    </div>
  `;
  
  openModal(`Chat with ${escapeHtml(u)}`, historyHtml);
  const view=document.getElementById('pm-history-container');
  if(view) view.scrollTop=view.scrollHeight;
  
  const inp=document.getElementById('pm-history-input');
  if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')sendPMFromHistory(u);});
};

window.sendPMFromHistory=async(u)=>{
  const inp=document.getElementById('pm-history-input');
  const t=inp.value.trim();if(!t)return;
  await fetch(API+'/api/send-pm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:currentUser.username,receiver:u,text:t})});
  showPMHistory(u); 
};

window.startNewPM=(u)=>{
  fetch(API+'/api/user?username='+u).then(res=>res.json()).then(data=>{
    if(data.success) {
      openPMPopup(u, "", data.user);
      const popupId = document.querySelector('.pm-popup-card').id;
      showReplyBox(popupId, u);
    } else {
      alert("User not found");
    }
  });
};

window.addFriend=async(u)=>{
  const r=await fetch(API+'/api/add-friend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,friend:u})});
  const d=await r.json();
  if(d.success){currentUser.friends=JSON.stringify([...JSON.parse(currentUser.friends||'[]'),u]);alert('Added!');}
};

window.viewProfile=async(u)=>{
  const r=await fetch(API+'/api/user?username='+u);const d=await r.json();
  if(d.success){
    const u=d.user;
    openModal('Profile',`
      <div style="text-align:center;font-size:40px;margin-bottom:10px;">${u.avatar}</div>
      <div class="list-row"><span>Username</span><b>${u.username}</b></div>
      <div class="list-row"><span>ID</span><b>#${u.id}</b></div>
      <div class="list-row"><span>Score</span><b>${u.score}</b></div>
      <div class="list-row"><span>Dots</span><b>${u.isDotMaster?'∞':u.dots}</b></div>
      ${u.banUntil>Date.now()?`<button class="btn btn-danger" style="margin-top:12px;" onclick="payFine('${u.username}',${u.banFine})">Pay Fine (${u.banFine} dots)</button>`:''}
    `);
  }
};
window.payFine=async(u,fine)=>{
  if(currentUser.dots<fine)return alert('Not enough dots');
  const r=await fetch(API+'/api/admin/unban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:u})});
  const d=await r.json();
  if(d.success)alert('User unbanned!');else alert('Failed');
};

el('tb-games').onclick=()=>{
  openModal('Roulette',`
    <label class="field">Bet Type</label>
    <select id="rl-type"><option value="even">Even (2x)</option><option value="odd">Odd (2x)</option><option value="dozen1">1-12 (3x)</option><option value="dozen2">13-24 (3x)</option><option value="dozen3">25-36 (3x)</option><option value="number">Exact (36x)</option></select>
    <div id="rl-num-wrap" class="hidden"><label class="field">Number (0-36)</label><input type="number" id="rl-num" /></div>
    <label class="field">Bet Amount</label><input type="number" id="rl-amt" value="1" min="1" max="100" />
    <button class="btn" onclick="playRoulette()">Spin</button>
    <div id="rl-res" style="text-align:center;font-weight:bold;margin-top:16px;"></div>
  `);
  el('rl-type').onchange=()=>{el('rl-num-wrap').classList.toggle('hidden',el('rl-type').value!=='number');};
};
window.playRoulette=async()=>{
  const type=el('rl-type').value,num=el('rl-num')?parseInt(el('rl-num').value):0,amt=parseInt(el('rl-amt').value);
  const r=await fetch(API+'/api/play-roulette',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:currentUser.username,bet:amt,type,num})});
  const d=await r.json();
  if(d.success){
    currentUser=d.user;updateTopBar();
    el('rl-res').textContent=`Result: ${d.result}. ${d.win?'You won!':'You lost.'}`;
  }else{el('rl-res').textContent=d.message;}
};

el('tb-roominfo').onclick=async()=>{
  const r=await fetch(API+'/api/rooms');const d=await r.json();
  const room=d.rooms.find(x=>x.id==currentRoom);
  if(room){
    openModal('Room Info',`
      <div class="list-row"><span>Name</span><b>${room.name}</b></div>
      <div class="list-row"><span>ID</span><b>${room.id}</b></div>
      <div class="list-row"><span>Score</span><b>${room.score}</b></div>
      <div class="list-row"><span>Creator</span><b>${room.creator}</b></div>
    `);
  }
};

el('tb-admin').onclick=()=>{
  openModal('Admin Panel 👑',`
    <button class="btn" onclick="adminGiveDots()">Give Dots</button>
    <button class="btn btn-danger" style="background:#ef4444;margin-top:8px;" onclick="adminBan()">Ban User</button>
  `);
};
window.adminGiveDots=async()=>{
  const u=prompt('Username:');if(!u)return;
  const a=prompt('Amount:');if(!a)return;
  const r=await fetch(API+'/api/transfer-dots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'DotMaster',to:u,amount:parseInt(a)})});
  const d=await r.json();
  if(d.success)alert('Done!');else alert('Failed');
};
window.adminBan=async()=>{
  const u=prompt('Username to ban:');if(!u)return;
  const m=prompt('Minutes:');if(!m)return;
  const f=prompt('Fine (dots):');if(!f)return;
  const r=await fetch(API+'/api/admin/ban',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:u,minutes:parseInt(m),fine:parseInt(f)})});
  const d=await r.json();
  if(d.success)alert('Banned!');else alert('Failed');
};
window.banUser=(u)=>adminBan(u);
</script>
