<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dotverse</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#ffffff; --ink:#14181f; --muted:#6b7280; --line:#e7e9ee;
    --dot:#3d5afe; --dot-soft:#eef0ff; --danger:#e14b4b;
    --online:#22c55e; --offline:#d1455a; --gold:#c9971f; --radius:14px;
    --font-display: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--font-display); -webkit-font-smoothing:antialiased; }
  #app{height:100%; display:flex; flex-direction:column;}
  .hidden{ display:none !important; }
  ::-webkit-scrollbar{ width:8px; } ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  .dot-grid-bg{ position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image: radial-gradient(circle, var(--line) 1px, transparent 1px);
    background-size: 22px 22px; mask-image: linear-gradient(to bottom, black, transparent 70%); }

  /* ---- auth ---- */
  .auth-wrap{ position:relative; flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ position:relative; width:100%; max-width:380px; border:1px solid var(--line); border-radius:var(--radius);
    padding:32px 28px; background:#fff; box-shadow:0 1px 3px rgba(20,24,31,.04), 0 12px 32px -12px rgba(20,24,31,.08); }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand-dot{ width:14px; height:14px; border-radius:50%; background:var(--dot); box-shadow:0 0 0 4px var(--dot-soft); }
  .brand-name{ font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .auth-sub{ color:var(--muted); font-size:13.5px; margin:0 0 24px 0; }
  .tabs{ display:flex; gap:4px; margin-bottom:20px; background:#f4f5f7; border-radius:10px; padding:3px;}
  .tab{ flex:1; text-align:center; padding:8px 0; font-size:13.5px; font-weight:600; border-radius:8px; cursor:pointer; color:var(--muted); user-select:none; }
  .tab.active{ background:#fff; color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06); }
  label.field{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin:14px 0 6px; }
  label.field:first-of-type{ margin-top:0; }
  input[type=text], input[type=password], input[type=number]{ width:100%; padding:11px 12px; border:1px solid var(--line);
    border-radius:10px; font-size:14.5px; outline:none; background:#fbfbfc; transition:border-color .15s, background .15s; }
  input:focus{ border-color:var(--dot); background:#fff; }
  select.field-input{ width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font-size:14.5px; outline:none; background:#fbfbfc; }
  .btn{ padding:12px 0; border:none; border-radius:10px; cursor:pointer; font-size:14.5px; font-weight:700;
    transition:transform .08s, opacity .15s; }
  .btn:active{ transform:scale(.98); }
  .btn-primary{ width:100%; background:var(--dot); color:#fff; margin-top:20px; }
  .btn-primary:disabled{ opacity:.5; cursor:default; }
  .btn-sm{ padding:7px 12px; font-size:12.5px; border-radius:8px; background:#f4f5f7; color:var(--ink); }
  .auth-msg{ font-size:13px; margin-top:12px; min-height:16px; }
  .auth-msg.error{ color:var(--danger); } .auth-msg.ok{ color:var(--online); }

  /* ---- shell ---- */
  #shell{ flex:1; display:flex; height:100%; position:relative; overflow:hidden; }
  #sidebar{ width:240px; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:16px 12px; gap:2px; overflow-y:auto; flex-shrink:0; }

  #topbar-mobile{ display:none; }
  @media (max-width: 720px){
    #sidebar{ display:none; }
    #shell{ flex-direction:column; }
    #main{ width:100%; }
    #topbar-mobile{
      display:flex; align-items:stretch; justify-content:space-between;
      border-bottom:1px solid var(--line); background:#fff; flex-shrink:0; overflow-x:auto;
    }
    .topbar-btn{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
      padding:9px 4px; cursor:pointer; color:var(--muted); min-width:52px; }
    .topbar-btn .tb-icon{ font-size:18px; line-height:1; }
    .topbar-btn .tb-label{ font-size:8.5px; font-weight:700; letter-spacing:.01em; white-space:nowrap; }
    .topbar-btn.hidden{ display:none; }
    #room-header .rtitle{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  }
  .side-brand{ display:flex; align-items:center; gap:8px; padding:6px 8px 14px; }
  .side-brand .brand-name{ font-size:16px; }
  .side-section-title{ font-size:10.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 8px 6px; }
  .room-item{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--muted); }
  .room-item.active{ background:var(--dot-soft); color:var(--dot); }
  .room-item .pill{ margin-left:auto; font-size:10.5px; font-weight:700; color:var(--muted); background:#f2f3f5; padding:2px 6px; border-radius:20px; }
  .side-footer{ margin-top:auto; display:flex; flex-direction:column; gap:6px; }
  .profile-mini{ display:flex; align-items:center; gap:8px; padding:10px; border-radius:10px; border:1px solid var(--line); cursor:pointer; }
  .avatar-emoji{ font-size:20px; width:32px; height:32px; display:flex; align-items:center; justify-content:center; background:var(--dot-soft); border-radius:50%; flex-shrink:0; }
  .profile-mini .pname{ font-size:13px; font-weight:700; } .profile-mini .pdots{ font-size:11px; color:var(--muted); }
  .master-btn{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:9px; cursor:pointer; font-size:13px; font-weight:700; color:var(--gold); background:#fdf6e3; }

  #main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #room-header{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--line); }
  #room-header .rtitle{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:8px;}
  #room-header .rscore{ font-size:12px; color:var(--muted); font-weight:600; }
  .header-actions{ display:flex; gap:8px; align-items:center; }
  #messages{ flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .msg{ display:flex; gap:10px; max-width:640px; }
  .msg .avatar-emoji{ cursor:pointer; }
  .msg-body .msg-name{ font-size:12.5px; font-weight:700; margin-bottom:2px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .msg-body .msg-text{ font-size:14px; line-height:1.45; word-break:break-word; }
  #composer{ display:flex; gap:10px; padding:14px 20px; border-top:1px solid var(--line); }
  #composer input{ flex:1; }
  #composer button{ padding:0 20px; }
</style>
</head>
<body>
<div class="dot-grid-bg"></div>
<div id="app">

  <div id="auth-screen" class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
      <p class="auth-sub">A tiny chat world. Ten seats. One dot at a time.</p>
      <div class="tabs">
        <div class="tab active" id="tab-login">Log in</div>
        <div class="tab" id="tab-register">Register</div>
      </div>
      <div id="form-login">
        <label class="field">Username</label>
        <input type="text" id="login-username" autocomplete="username" />
        <label class="field">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" />
        <button class="btn btn-primary" id="btn-login">Log in</button>
      </div>
      <div id="form-register" class="hidden">
        <label class="field">Username</label>
        <input type="text" id="reg-username" />
        <label class="field">Password</label>
        <input type="password" id="reg-password" />
        <button class="btn btn-primary" id="btn-register">Create account</button>
      </div>
      <div class="auth-msg" id="auth-msg"></div>
    </div>
  </div>

  <div id="shell" class="hidden">
    <div id="topbar-mobile">
      <div class="topbar-btn" id="tb-profile"><span class="tb-icon" id="tb-profile-avatar">🙂</span><span class="tb-label">Profile</span></div>
      <div class="topbar-btn" id="tb-rooms"><span class="tb-icon">💬</span><span class="tb-label">Rooms</span></div>
      <div class="topbar-btn hidden" id="tb-admin"><span class="tb-icon">👑</span><span class="tb-label">Admin</span></div>
    </div>
    <div id="sidebar">
      <div class="side-brand"><span class="brand-dot"></span><span class="brand-name">Dotverse</span></div>
      <div class="side-section-title">Rooms</div>
      <div id="room-list"></div>
      <div class="side-footer">
        <div class="master-btn hidden" id="btn-open-dotmaster"><span>👑</span><span>DotMaster panel</span></div>
        <div class="profile-mini" id="open-profile">
          <span class="avatar-emoji" id="mini-avatar">🙂</span>
          <div><div class="pname" id="mini-name">—</div><div class="pdots" id="mini-dots">0 dots</div></div>
        </div>
      </div>
    </div>

    <div id="main">
      <div id="room-header">
        <div class="rtitle"><span id="room-title">Lobby</span><span class="rscore" id="room-meta">ID: 1</span></div>
      </div>
      <div id="messages"></div>
      <div id="composer">
        <input type="text" id="msg-input" placeholder="Say something…" maxlength="500" />
        <button class="btn btn-primary" style="margin:0;width:auto;" id="btn-send">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = "https://dotverse-api.erfanzrd98.workers.dev";
let currentUser = null;
let currentRoom = "1";
let msgInterval = null;

function el(id){ return document.getElementById(id); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function showMsg(text, ok){ const e=el('auth-msg'); e.textContent=text; e.className='auth-msg '+(ok?'ok':'error'); }

el('tab-login').onclick=()=>{ el('tab-login').classList.add('active'); el('tab-register').classList.remove('active');
  el('form-login').classList.remove('hidden'); el('form-register').classList.add('hidden'); showMsg('',true); };
el('tab-register').onclick=()=>{ el('tab-register').classList.add('active'); el('tab-login').classList.remove('active');
  el('form-register').classList.remove('hidden'); el('form-login').classList.add('hidden'); showMsg('',true); };

el('btn-register').onclick = async () => {
  const u = el('reg-username').value.trim();
  const p = el('reg-password').value;
  if(!u||!p){ showMsg('Username and password are required.'); return; }
  el('btn-register').disabled=true;
  try{
    const res = await fetch(API_URL + '/api/register', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username:u, password:p }) });
    const data = await res.json();
    if(data.success){ currentUser = data.user; startApp(); } else { showMsg(data.message || 'Registration failed.'); }
  }catch(e){ showMsg('Network error: '+e.message); }
  el('btn-register').disabled=false;
};

el('btn-login').onclick = async () => {
  const u = el('login-username').value.trim();
  const p = el('login-password').value;
  if(!u||!p){ showMsg('Enter your username and password.'); return; }
  el('btn-login').disabled=true;
  try{
    const res = await fetch(API_URL + '/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ username:u, password:p }) });
    const data = await res.json();
    if(data.success){ currentUser = data.user; startApp(); } else { showMsg(data.message || 'Login failed.'); }
  }catch(e){ showMsg('Network error: '+e.message); }
  el('btn-login').disabled=false;
};

function startApp(){
  el('auth-screen').classList.add('hidden');
  el('shell').classList.remove('hidden');
  if(currentUser.isDotMaster === 1){ el('btn-open-dotmaster').classList.remove('hidden'); el('tb-admin').classList.remove('hidden'); }
  renderProfileMini();
  loadRooms();
  joinRoom('1');
  setInterval(loadRooms, 5000);
}

function renderProfileMini(){
  el('mini-avatar').textContent = currentUser.avatar || '🙂';
  el('mini-name').textContent = currentUser.username;
  el('mini-dots').textContent = currentUser.isDotMaster ? '∞ dots' : (currentUser.dots + ' dots');
}

async function loadRooms(){
  try{
    const res = await fetch(API_URL + '/api/rooms');
    const data = await res.json();
    if(data.success){
      const list = el('room-list'); list.innerHTML='';
      data.rooms.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room-item' + (r.id == currentRoom ? ' active':'');
        const icon = r.id===1 ? '💬' : r.id===2 ? '⭐' : '🏠';
        div.innerHTML = `<span>${icon}</span><span>${escapeHtml(r.name)}</span><span class="pill">${r.score||0}</span>`;
        div.onclick = ()=> joinRoom(r.id);
        list.appendChild(div);
      });
    }
  }catch(e){}
}

async function joinRoom(roomId){
  currentRoom = roomId;
  if(msgInterval) clearInterval(msgInterval);
  loadMessages();
  msgInterval = setInterval(loadMessages, 2000);
}

async function loadMessages(){
  try{
    const res = await fetch(API_URL + '/api/messages?room_id=' + currentRoom);
    const data = await res.json();
    if(data.success){
      const wrap = el('messages'); wrap.innerHTML='';
      data.messages.forEach(m => {
        const div = document.createElement('div');
        div.className = 'msg';
        div.innerHTML = `<span class="avatar-emoji">${m.avatar||'🙂'}</span><div class="msg-body"><div class="msg-name" style="color:${m.nameColor||'#000'}">${escapeHtml(m.username)}</div><div class="msg-text">${escapeHtml(m.text)}</div></div>`;
        wrap.appendChild(div);
      });
      wrap.scrollTop = wrap.scrollHeight;
    }
  }catch(e){}
}

el('btn-send').onclick = async () => {
  const text = el('msg-input').value.trim();
  if(!text) return;
  el('msg-input').value='';
  try{
    await fetch(API_URL + '/api/send-message', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ room_id: currentRoom, username: currentUser.username, avatar: currentUser.avatar, text: text, nameColor: currentUser.nameColor }) });
    loadMessages();
  }catch(e){}
};

el('msg-input').addEventListener('keydown', e=>{ if(e.key==='Enter') el('btn-send').click(); });
el('tb-rooms').onclick = ()=> alert('Rooms are listed on the left sidebar!');
el('open-profile').onclick = ()=> alert('Profile editing coming next!');
</script>
</body>
</html>
